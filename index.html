<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Photobooth 3 Frame</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4eee8;
  color:#4d3a31;
  min-height:100vh;
  display:flex;
  justify-content:center;
}

.app{
  width:100%;
  max-width:1100px;
  padding:28px 18px 50px;
}

h1{
  text-align:center;
  margin:0 0 6px;
  font-size:30px;
}

.sub{
  text-align:center;
  margin:0 0 24px;
  color:#806d62;
}

.layout{
  display:grid;
  grid-template-columns:minmax(280px,1fr) 360px;
  gap:28px;
  align-items:start;
}

.card{
  background:white;
  border-radius:18px;
  padding:18px;
  box-shadow:0 8px 30px rgba(0,0,0,.08);
}

video{
  width:100%;
  aspect-ratio:4/3;
  object-fit:cover;
  border-radius:14px;
  background:#222;
  transform:scaleX(-1);
}

.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:14px;
}

button{
  border:0;
  border-radius:999px;
  padding:12px 18px;
  font-weight:700;
  cursor:pointer;
  background:#806453;
  color:white;
}

button.secondary{
  background:#eee5de;
  color:#4d3a31;
}

button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

#countdown{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  font-size:110px;
  font-weight:800;
  color:white;
  background:rgba(0,0,0,.35);
  z-index:5;
}

.result-wrap{
  display:flex;
  justify-content:center;
}

canvas{
  width:100%;
  max-width:330px;
  height:auto;
  display:block;
  background:#fff;
  box-shadow:0 6px 20px rgba(0,0,0,.12);
}

.small{
  font-size:13px;
  color:#8b7b72;
  line-height:1.5;
}

.photo-list{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:12px;
}

.photo-list img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:8px;
  background:#eee;
}

@media(max-width:800px){
  .layout{
    grid-template-columns:1fr;
  }

  .card{
    max-width:520px;
    margin:auto;
    width:100%;
  }
}
</style>
</head>

<body>

<div id="countdown">3</div>

<div class="app">

  <h1>PHOTOBOOTH</h1>

  <p class="sub">
    3 Frame • Ambil Foto • Download JPG
  </p>

  <div class="layout">

    <!-- BAGIAN KAMERA -->
    <div class="card">

      <video id="video" autoplay playsinline></video>

      <div class="controls">

        <button id="startBtn">
          Aktifkan Kamera
        </button>

        <button id="takeBtn" disabled>
          📸 Ambil 3 Foto
        </button>

        <button id="resetBtn" class="secondary">
          Ulangi
        </button>

      </div>

      <p class="small">
        Izinkan akses kamera saat browser meminta izin.
        Setelah tombol "Ambil 3 Foto" ditekan,
        sistem mengambil 3 foto dengan countdown.
      </p>

      <div class="photo-list">

        <img id="p1" alt="Foto 1">

        <img id="p2" alt="Foto 2">

        <img id="p3" alt="Foto 3">

      </div>

    </div>


    <!-- BAGIAN HASIL -->
    <div class="card">

      <h2 style="margin-top:0">
        Hasil Template
      </h2>

      <div class="result-wrap">

        <canvas
          id="output"
          width="900"
          height="1600">
        </canvas>

      </div>

      <div class="controls">

        <button id="downloadBtn" disabled>
          ⬇ Download JPG
        </button>

      </div>

      <p class="small">
        Foto akan otomatis dimasukkan ke dalam
        template photobooth yang sudah diupload.
      </p>

    </div>

  </div>

</div>


<script>

const video = document.getElementById('video');

const startBtn =
  document.getElementById('startBtn');

const takeBtn =
  document.getElementById('takeBtn');

const resetBtn =
  document.getElementById('resetBtn');

const downloadBtn =
  document.getElementById('downloadBtn');

const countdown =
  document.getElementById('countdown');

const canvas =
  document.getElementById('output');

const ctx =
  canvas.getContext('2d');


const imgs = [

  document.getElementById('p1'),

  document.getElementById('p2'),

  document.getElementById('p3')

];


let stream = null;

let photos = [];


/*
====================================================
LOAD TEMPLATE PNG
====================================================
*/

const templateImage = new Image();

templateImage.src = 'Template Photobooth.png';


/*
====================================================
FUNGSI TUNGGU
====================================================
*/

function wait(ms){

  return new Promise(
    resolve => setTimeout(resolve,ms)
  );

}


/*
====================================================
AKTIFKAN KAMERA
====================================================
*/

async function startCamera(){

  try{

    stream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:"user",
          width:{ideal:1280},
          height:{ideal:720}
        },

        audio:false

      });


    video.srcObject = stream;

    takeBtn.disabled = false;

    startBtn.textContent =
      "Kamera Aktif";

  }

  catch(err){

    alert(
      "Kamera tidak bisa diakses. " +
      "Pastikan izin kamera diberikan " +
      "dan website dibuka melalui HTTPS."
    );

  }

}


/*
====================================================
COUNTDOWN
====================================================
*/

async function countDown(){

  countdown.style.display = 'flex';

  for(let n=3; n>=1; n--){

    countdown.textContent = n;

    await wait(800);

  }

  countdown.style.display = 'none';

}


/*
====================================================
AMBIL FOTO DARI KAMERA
====================================================
*/

function capture(){

  const c =
    document.createElement('canvas');

  c.width = 900;

  c.height = 675;

  const x =
    c.getContext('2d');


  /*
  Mirror foto supaya sama seperti
  tampilan kamera
  */

  x.save();

  x.translate(c.width,0);

  x.scale(-1,1);

  x.drawImage(
    video,
    0,
    0,
    c.width,
    c.height
  );

  x.restore();


  return c.toDataURL(
    'image/jpeg',
    0.92
  );

}


/*
====================================================
AMBIL 3 FOTO
====================================================
*/

async function takePhotos(){

  takeBtn.disabled = true;

  photos = [];


  for(let i=0; i<3; i++){

    await countDown();

    const data =
      capture();

    photos.push(data);

    imgs[i].src = data;

    await wait(500);

  }


  await drawResult();

  downloadBtn.disabled = false;

  takeBtn.disabled = false;

}


/*
====================================================
LOAD FOTO
====================================================
*/

function loadImage(src){

  return new Promise(

    (resolve,reject)=>{

      const im =
        new Image();

      im.onload =
        () => resolve(im);

      im.onerror =
        reject;

      im.src = src;

    }

  );

}


/*
====================================================
GAMBAR HASIL PHOTOBOOTH
====================================================
*/

async function drawResult(){

  /*
  Pastikan template sudah selesai
  dimuat sebelum digambar
  */

  if(!templateImage.complete){

    await new Promise(
      resolve => {

        templateImage.onload =
          resolve;

      }
    );

  }


  /*
  ==================================================
  BACKGROUND
  ==================================================
  */

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /*
  Background putih sementara
  */

  ctx.fillStyle = '#ffffff';

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /*
  ==================================================
  POSISI 3 FOTO
  ==================================================

  Template kamu memiliki 3 frame.

  Ukuran canvas:
  900 x 1600

  Posisi ini dibuat mengikuti
  template yang kamu upload.
  */


  const frameX = 120;

  const frameWidth = 660;

  const frameHeight = 380;


  const frameY = [

    330,

    735,

    1140

  ];


  /*
  ==================================================
  MASUKKAN FOTO KE 3 FRAME
  ==================================================
  */

  for(let i=0; i<3; i++){

    const im =
      await loadImage(photos[i]);


    const x =
      frameX;

    const y =
      frameY[i];


    /*
    Crop foto supaya memenuhi
    frame tanpa gepeng
    */

    const ratio =
      Math.max(
        frameWidth / im.width,
        frameHeight / im.height
      );


    const sw =
      frameWidth / ratio;

    const sh =
      frameHeight / ratio;


    const sx =
      (im.width - sw) / 2;

    const sy =
      (im.height - sh) / 2;


    ctx.drawImage(

      im,

      sx,
      sy,
      sw,
      sh,

      x,
      y,
      frameWidth,
      frameHeight

    );

  }


  /*
  ==================================================
  TARUH TEMPLATE DI ATAS FOTO
  ==================================================
  */

  ctx.drawImage(

    templateImage,

    0,
    0,
    canvas.width,
    canvas.height

  );

}


/*
====================================================
RESET
====================================================
*/

function reset(){

  photos = [];


  imgs.forEach(

    img => {

      img.removeAttribute('src');

    }

  );


  ctx.clearRect(

    0,
    0,
    canvas.width,
    canvas.height

  );


  /*
  Tampilkan template kosong
  */

  if(templateImage.complete){

    ctx.drawImage(

      templateImage,

      0,
      0,
      canvas.width,
      canvas.height

    );

  }

  else{

    templateImage.onload = () => {

      ctx.drawImage(

        templateImage,

        0,
        0,
        canvas.width,
        canvas.height

      );

    };

  }


  downloadBtn.disabled = true;

}


/*
====================================================
DOWNLOAD JPG
====================================================
*/

downloadBtn.addEventListener(

  'click',

  () => {

    const a =
      document.createElement('a');


    a.download =
      'photobooth-dusun-sembuh-kulon.jpg';


    a.href =
      canvas.toDataURL(
        'image/jpeg',
        0.95
      );


    a.click();

  }

);


/*
====================================================
BUTTON
====================================================
*/

startBtn.addEventListener(
  'click',
  startCamera
);

takeBtn.addEventListener(
  'click',
  takePhotos
);

resetBtn.addEventListener(
  'click',
  reset
);


/*
====================================================
JALANKAN TEMPLATE SAAT WEBSITE DIBUKA
====================================================
*/

templateImage.onload = () => {

  reset();

};

</script>

</body>
</html>
